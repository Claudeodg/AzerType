<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Log in</title>
    <link rel="stylesheet" th:href="@{/topbar.css}">
    <link rel="stylesheet" th:href="@{/style1.css}">
    <script th:src="@{/language.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/topbar :: topbar('auth')}"></div>

<div class="login-container">
    <h2 th:text="#{login.title}">Log in</h2>
    <p th:if="${error}" th:text="#{${error}}" class="form-error" role="alert"></p>
    <p th:if="${message}" th:text="#{${message}}" class="form-message" role="status"></p>
    <form th:action="@{/auth/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="email" name="email" th:placeholder="#{login.email}" th:aria-label="#{login.email}" autocomplete="email" required>
        <input type="password" name="password" th:placeholder="#{login.password}" th:aria-label="#{login.password}" autocomplete="current-password" required>
        <button type="submit" th:text="#{login.submit}">Log in</button>
    </form>
    <p><a th:href="@{/auth/forgot-password}" th:text="#{login.forgot}">Forgot your password?</a></p>
    <p><span th:text="#{login.noAccount}">Not registered yet?</span> <a th:href="@{/auth/register}" th:text="#{login.register}">Create an account</a></p>
</div>
</body>
</html>
