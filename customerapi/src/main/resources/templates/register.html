<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title}">Create an account</title>
    <link rel="stylesheet" th:href="@{/topbar.css}">
    <link rel="stylesheet" th:href="@{/style1.css}">
    <script th:src="@{/language.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/topbar :: topbar('auth')}"></div>

<div class="login-container">
    <h2 th:text="#{register.title}">Create an account</h2>
    <p th:if="${error}" th:text="#{${error}}" class="form-error" role="alert"></p>
    <p th:if="${message}" th:text="#{${message}}" class="form-message" role="status"></p>
    <form th:action="@{/auth/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="email" name="email" th:placeholder="#{register.email}" th:aria-label="#{register.email}" autocomplete="email" required>
        <input type="password" id="password" name="password" th:placeholder="#{register.password}" th:aria-label="#{register.password}" autocomplete="new-password" required minlength="8">
        <input type="password" id="confirmPassword" name="confirmPassword" th:placeholder="#{register.confirm}" th:aria-label="#{register.confirm}" autocomplete="new-password" required minlength="8">
        <label class="show-password">
            <input type="checkbox" id="togglePassword" onchange="toggleRegisterPasswordFields()">
            <span th:text="#{register.show}">Show password</span>
        </label>
        <button type="submit" th:text="#{register.submit}">Sign up</button>
    </form>
    <p><span th:text="#{register.haveAccount}">Already registered?</span> <a th:href="@{/auth/login}" th:text="#{register.login}">Log in</a></p>
</div>
<script>
    // Shows or hides both password fields at once.
    function toggleRegisterPasswordFields() {
        const show = document.getElementById('togglePassword').checked;
        const type = show ? 'text' : 'password';
        document.getElementById('password').type = type;
        document.getElementById('confirmPassword').type = type;
    }
</script>
</body>
</html>
