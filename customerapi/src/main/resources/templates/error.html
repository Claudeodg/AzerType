<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{errorPage.pageTitle}">AzerType – Error</title>
    <link rel="stylesheet" th:href="@{/topbar.css}">
    <link rel="stylesheet" th:href="@{/app.css}">
    <script th:src="@{/language.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/topbar :: topbar('error')}"></div>

<!-- Message depends on the HTTP status: 404, 403 or any other error. -->
<main class="page page-narrow"
      th:with="kind=${status == 404} ? 'notFound' : (${status == 403} ? 'forbidden' : 'generic')">
    <section class="card empty-state error-state">
        <p class="error-code" th:if="${status != null}" th:text="#{errorPage.code(${status})}">Error 500</p>
        <h1 th:text="#{${'errorPage.' + kind + '.title'}}">Something went wrong</h1>
        <p class="muted" th:text="#{${'errorPage.' + kind + '.text'}}">An unexpected error occurred. Please try again later.</p>

        <div class="error-actions">
            <a th:if="${loggedIn}" th:href="@{/azerType}" class="btn btn-primary" th:text="#{errorPage.backToPractice}">Back to practice</a>
            <a th:unless="${loggedIn}" th:href="@{/}" class="btn btn-primary" th:text="#{errorPage.backToHome}">Back to home page</a>
        </div>
    </section>
</main>

<footer class="footer" th:text="#{footer.copyright}">© AzerType</footer>

</body>
</html>
