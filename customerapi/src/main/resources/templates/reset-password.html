<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reset.title}">Choose a new password</title>
    <link rel="stylesheet" th:href="@{/topbar.css}">
    <link rel="stylesheet" th:href="@{/style1.css}">
    <script th:src="@{/language.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/topbar :: topbar('auth')}"></div>

<div class="login-container">
    <h2 th:text="#{reset.title}">Choose a new password</h2>
    <p th:if="${error}" th:text="#{${error}}" class="form-error" role="alert"></p>
    <p th:if="${message}" th:text="#{${message}}" class="form-message" role="status"></p>

    <form th:if="${token}" th:action="@{/auth/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <input type="password" name="newPassword" th:placeholder="#{reset.new}" th:aria-label="#{reset.new}" autocomplete="new-password" required minlength="8">
        <input type="password" name="confirmNewPassword" th:placeholder="#{reset.confirm}" th:aria-label="#{reset.confirm}" autocomplete="new-password" required minlength="8">
        <button type="submit" th:text="#{reset.submit}">Reset password</button>
    </form>

    <p><a th:href="@{/auth/login}" th:text="#{back.login}">Back to log in</a></p>
</div>
</body>
</html>
