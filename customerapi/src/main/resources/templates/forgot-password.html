<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{forgot.title}">Forgot your password</title>
    <link rel="stylesheet" th:href="@{/topbar.css}">
    <link rel="stylesheet" th:href="@{/style1.css}">
    <script th:src="@{/language.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/topbar :: topbar('auth')}"></div>

<div class="login-container">
    <h2 th:text="#{forgot.title}">Forgot your password</h2>
    <p th:if="${error}" th:text="#{${error}}" class="form-error" role="alert"></p>
    <p th:if="${message}" th:text="#{${message}}" class="form-message" role="status"></p>
    <p class="form-intro" th:text="#{forgot.intro}">Enter your email and we will send you a link.</p>
    <form th:action="@{/auth/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="email" name="email" th:placeholder="#{forgot.email}" th:aria-label="#{forgot.email}" autocomplete="email" required>
        <button type="submit" th:text="#{forgot.submit}">Send reset link</button>
    </form>
    <p><a th:href="@{/auth/login}" th:text="#{back.login}">Back to log in</a></p>
</div>
</body>
</html>
