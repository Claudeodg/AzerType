#spring.application.name=customerapi

# All secrets come from environment variables (see .env.example).
# For local development they can instead be set in application-local.properties
# (git-ignored, loaded by the "local" profile below). Never commit real values here.

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/customerapi}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Translations: messages.properties (English, default) and messages_de.properties (German).
# No fallback to the server's OS language: an unsupported language always falls back to English.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Python analysis microservice
python.service.url=${PYTHON_SERVICE_URL:http://localhost:5000}

# Public base URL, used to build password-reset links
app.base-url=${APP_BASE_URL:http://localhost:${server.port:8080}}

# Gemini (key is required, no default on purpose)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.api.key=${GEMINI_API_KEY}

# SMTP for password-reset emails (Gmail: use an App Password, not your normal password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
