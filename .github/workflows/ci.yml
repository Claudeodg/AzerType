# Runs the Spring Boot and Flask test suites on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Spring Boot tests
    runs-on: ubuntu-latest

    # Real MySQL so that CustomerapiApplicationTests (full context) can start.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customerapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: customerapi

    # Test values only: no real secret is needed, nothing is sent to Gemini or SMTP.
    env:
      SPRING_PROFILES_ACTIVE: ci
      DB_URL: jdbc:mysql://127.0.0.1:3306/customerapi
      DB_USERNAME: root
      DB_PASSWORD: root
      GEMINI_API_KEY: test-key
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is stored without the executable bit in git (committed from Windows).
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-test-report
          path: customerapi/build/reports/tests/test

  microservice:
    name: Flask tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MicroService

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MicroService/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
